name: Run Tests
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
jobs:
  build:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run tests
        run: go test -race -coverprofile=profile.cov -covermode=atomic ./...
